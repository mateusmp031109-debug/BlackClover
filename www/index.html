<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#111;color:#fff;font-family:sans-serif;padding:24px}input,button{width:100%;padding:14px;margin-top:12px;font-size:16px;box-sizing:border-box}</style></head><body><h2>Meu Jogo</h2><p>Cole o link do jogo:</p><input id="u" placeholder="https://...trycloudflare.com"><button onclick="abrir()">Abrir</button><script>var u=document.getElementById('u');try{u.value=localStorage.getItem('link')||''}catch(e){}function abrir(){var v=u.value.trim();if(!v.startsWith('http'))v='https://'+v;try{localStorage.setItem('link',v)}catch(e){}location.href=v}</script></body></html>
